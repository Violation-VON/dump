name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - UE4SS_ObjectDump.txt
      - UE4SS_ObjectDump.txt.gz
      - VERSION
      - src/**
      - vite.config.ts
      - scripts/**
      - deno.json
      - deno.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: data
        uses: actions/cache@v6
        with:
          path: src/data
          key: data-${{ hashFiles('UE4SS_ObjectDump.txt*', 'scripts/**', 'src/types.ts') }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: |
          git lfs pull
          deno task data
      - id: pages
        uses: actions/configure-pages@v6
      - run: deno task bundle
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
